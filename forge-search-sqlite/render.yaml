# SQLite lives on disk, and Render's free web service filesystem is
# ephemeral (wiped on every deploy/restart). If you deploy this to Render,
# add a paid persistent Disk mounted at /data and set DB_PATH=/data/forge_search.db
# so your index survives restarts. Uncomment "disk:" below once you're on a paid plan.

services:
  - type: web
    name: forge-search-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    # disk:
    #   name: forge-search-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: DB_PATH
        value: forge_search.db   # change to /data/forge_search.db if using a persistent disk
