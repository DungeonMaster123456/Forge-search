<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge-Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1210;
    --bg-raised: #171B18;
    --border: #262B27;
    --ember: #E8703A;
    --ember-dim: #E8703A33;
    --highlight: #F4C95D;
    --steel: #8A9290;
    --text: #E9ECE9;
    --text-dim: #B4BAB6;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', -apple-system, sans-serif;
    /* Jarvis accent — a soft multi-hue gradient, distinct from the forge/
       ember palette used everywhere else, so the AI feature reads as its
       own moment rather than reskinning the whole app. */
    --jarvis-1: #4C8DFF;
    --jarvis-2: #A855F7;
    --jarvis-3: #EC4899;
    --jarvis-gradient: linear-gradient(120deg, var(--jarvis-1), var(--jarvis-2) 50%, var(--jarvis-3));
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12vh 20px 60px;
    transition: padding-top 0.4s ease;
  }

  body.has-results { padding-top: 4vh; }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 28px;
    user-select: none;
    cursor: pointer;
  }

  .brand .mark {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 28px;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .brand .mark .dash { color: var(--ember); }
  .brand .tagline { font-family: var(--mono); font-size: 12px; color: var(--steel); letter-spacing: 0.5px; }

  .search-shell { width: 100%; max-width: 680px; position: relative; }

  .search-box {
    position: relative;
    border-radius: 10px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    transition: border-color 0.25s ease, box-shadow 0.4s ease;
  }

  .search-box:focus-within {
    border-color: transparent;
    box-shadow: 0 0 0 1px var(--ember-dim), 0 0 24px -4px var(--ember-dim);
  }

  #q {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 16px;
    padding: 16px 48px 16px 20px;
  }

  #q::placeholder { color: var(--steel); }

  .search-icon {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--steel);
    pointer-events: none;
  }

  .tabs {
    display: none;
    gap: 4px;
    margin-top: 18px;
    border-bottom: 1px solid var(--border);
  }

  .tabs.visible { display: flex; }

  .tabs-row {
    display: none;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
    border-bottom: 1px solid var(--border);
  }

  .tabs-row.visible { display: flex; }
  .tabs-row .tabs { border-bottom: none; margin-top: 0; display: flex; }

  .safesearch-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--steel);
    transition: all 0.2s ease;
  }

  .safesearch-toggle.on {
    color: #4ADE80;
    border-color: #4ADE8044;
    background: #4ADE8011;
  }

  .safesearch-toggle.off {
    color: var(--highlight);
    border-color: var(--highlight);
    background: #F4C95D14;
  }

  .safesearch-toggle:hover { opacity: 0.85; }

  .tab {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--steel);
    background: none;
    border: none;
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    letter-spacing: 0.3px;
  }

  .tab:hover { color: var(--text-dim); }
  .tab.active { color: var(--ember); border-bottom-color: var(--ember); }

  #status {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--steel);
    margin: 14px 4px 0;
    min-height: 16px;
    letter-spacing: 0.3px;
  }

  #status .count { color: var(--ember); font-weight: 600; }

  .content-layout {
    width: 100%;
    max-width: 1000px;
    margin-top: 8px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 32px;
  }

  .content-layout.with-panel { grid-template-columns: minmax(0, 680px) 300px; }

  #results { width: 100%; max-width: 680px; }

  .section-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--steel);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 28px 0 4px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .section-label:first-child { margin-top: 0; }

  .result {
    padding: 20px 4px;
    border-bottom: 1px solid var(--border);
    animation: rise 0.35s ease backwards;
  }

  .result:last-child { border-bottom: none; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-domain {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ember);
    letter-spacing: 0.4px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .favicon { width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; }

  .result a.title {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 17px;
    color: var(--text);
    text-decoration: none;
    display: block;
    margin-bottom: 6px;
  }

  .result a.title:hover { color: var(--highlight); }

  .result .snippet { color: var(--text-dim); font-size: 14px; line-height: 1.55; margin-bottom: 8px; }

  .result .meta { font-family: var(--mono); font-size: 11px; color: var(--steel); display: flex; gap: 14px; }

  .empty-state {
    text-align: center;
    color: var(--steel);
    font-family: var(--mono);
    font-size: 13px;
    margin-top: 40px;
    line-height: 1.8;
  }

  .empty-state .big { font-size: 15px; color: var(--text-dim); margin-bottom: 6px; }

  /* Knowledge panel */
  .panel {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    height: fit-content;
    animation: rise 0.4s ease backwards;
  }

  .panel img.thumb {
    width: 100%;
    max-height: 160px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 14px;
  }

  .panel h2 { font-size: 19px; margin: 0 0 10px; color: var(--text); }
  .panel p { font-size: 13.5px; line-height: 1.6; color: var(--text-dim); margin: 0 0 14px; }

  .panel a.source-link {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ember);
    text-decoration: none;
  }

  .panel a.source-link:hover { text-decoration: underline; }

  /* Images grid */
  .image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 1000px;
  }

  .image-card {
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    animation: rise 0.35s ease backwards;
    text-decoration: none;
    display: block;
  }

  .image-card img { width: 100%; height: 130px; object-fit: cover; display: block; }
  .image-card .cap { padding: 8px 10px; font-size: 11px; color: var(--text-dim); }

  /* SafeSearch "black wall" — fully opaque, not blurred. Content is not
     rendered at all underneath (no img src loaded), and only reveals on
     an explicit click, with a confirmation of what's being unblocked. */
  .image-card.blocked { position: relative; }

  .image-card.blocked img { display: none; }

  .black-wall {
    width: 100%;
    height: 130px;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    border: 1px solid #ffffff11;
  }

  .black-wall svg { color: #666; }
  .black-wall .bw-label {
    font-family: var(--mono);
    font-size: 10px;
    color: #777;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .result.blocked .black-wall {
    height: 90px;
    border-radius: 8px;
  }

  .fallback-banner {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--highlight);
    background: #F4C95D14;
    border: 1px solid #F4C95D33;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 12px;
    line-height: 1.6;
  }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 36px;
    padding-bottom: 20px;
    width: 100%;
    max-width: 680px;
    font-family: var(--mono);
  }

  .page-num {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 14px;
    padding: 8px 12px;
    cursor: pointer;
    border-radius: 6px;
  }

  .page-num:hover { background: var(--bg-raised); }
  .page-num.active { color: var(--ember); font-weight: 700; }

  .next-page-btn {
    background: var(--ember);
    color: #0F1210;
    border: none;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 20px;
    cursor: pointer;
    margin-left: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .next-page-btn:hover { opacity: 0.9; }
  .next-page-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* People also ask */
  .paa-section { margin: 28px 0; }

  .paa-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    overflow: hidden;
    background: var(--bg-raised);
  }

  .paa-question {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14.5px;
    font-weight: 500;
    padding: 14px 16px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .paa-question .chev {
    color: var(--steel);
    transition: transform 0.25s ease;
    flex-shrink: 0;
  }

  .paa-item.open .paa-question .chev { transform: rotate(180deg); }

  .paa-answer {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, padding 0.3s ease;
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.6;
    padding: 0 16px;
  }

  .paa-item.open .paa-answer { max-height: 300px; padding: 0 16px 16px; }

  /* Jarvis — Gemini-style AI panel */
  .jarvis-trigger {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 14px;
    margin: 24px 0;
    cursor: pointer;
    width: fit-content;
  }

  .jarvis-trigger:hover { border-color: var(--jarvis-2); }

  .jarvis-orb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--jarvis-gradient);
    flex-shrink: 0;
    animation: orb-pulse 3s ease-in-out infinite;
  }

  @keyframes orb-pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.12); opacity: 0.85; }
  }

  .jarvis-panel {
    position: fixed;
    top: 0;
    right: -420px;
    width: 400px;
    max-width: 92vw;
    height: 100vh;
    background: var(--bg-raised);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: right 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 100;
  }

  .jarvis-panel.open { right: 0; }

  .jarvis-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
  }

  .jarvis-header .title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 15px;
    background: var(--jarvis-gradient);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .jarvis-close {
    background: none;
    border: none;
    color: var(--steel);
    cursor: pointer;
    padding: 4px;
  }

  .jarvis-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .jmsg {
    max-width: 88%;
    font-size: 14px;
    line-height: 1.55;
    padding: 12px 14px;
    border-radius: 14px;
    animation: rise 0.3s ease backwards;
  }

  .jmsg.user {
    align-self: flex-end;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .jmsg.assistant {
    align-self: flex-start;
    background: linear-gradient(135deg, #4C8DFF14, #A855F714);
    border: 1px solid #A855F733;
    color: var(--text-dim);
  }

  .jmsg.assistant.loading { display: flex; gap: 5px; align-items: center; }

  .jdot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--jarvis-2);
    animation: jdot-bounce 1.2s ease-in-out infinite;
  }

  .jdot:nth-child(2) { animation-delay: 0.15s; }
  .jdot:nth-child(3) { animation-delay: 0.3s; }

  @keyframes jdot-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .jarvis-input-row {
    display: flex;
    gap: 8px;
    padding: 16px;
    border-top: 1px solid var(--border);
  }

  #jarvisInput {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 16px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13.5px;
    outline: none;
  }

  #jarvisInput:focus { border-color: var(--jarvis-2); }

  .jarvis-send {
    background: var(--jarvis-gradient);
    border: none;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  .jarvis-send:disabled { opacity: 0.4; cursor: not-allowed; }

  .jarvis-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #00000066;
    z-index: 99;
  }

  .jarvis-overlay.open { display: block; }

  /* Forge Shopping — product cards */
  .shopping-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    width: 100%;
    max-width: 1000px;
  }

  .product-card {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    text-decoration: none;
    display: block;
    animation: rise 0.35s ease backwards;
  }

  .product-card:hover { border-color: var(--ember); }

  .product-card .p-price {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    color: var(--ember);
    margin-bottom: 8px;
  }

  .product-card .p-title {
    font-size: 14px;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .product-card .p-source {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--steel);
  }

  ::selection { background: var(--ember-dim); color: var(--text); }
</style>
</head>
<body>
  <div class="brand" onclick="resetHome()">
    <span class="mark">forge<span class="dash">-</span>search</span>
    <span class="tagline">// self-hosted index</span>
  </div>

  <div class="search-shell">
    <div class="search-box">
      <input id="q" type="text" placeholder="search the index…" autofocus autocomplete="off">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </div>
    <div class="tabs-row">
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="web">Web</button>
        <button class="tab" data-tab="images">Images</button>
        <button class="tab" data-tab="news">News</button>
        <button class="tab" data-tab="videos">Videos</button>
        <button class="tab" data-tab="shopping">Shopping</button>
      </div>
      <button class="safesearch-toggle on" id="safeToggle" title="Toggle SafeSearch">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span id="safeToggleLabel">SafeSearch: On</span>
      </button>
    </div>
    <p id="status"></p>
  </div>

  <div class="content-layout" id="contentLayout">
    <div id="results"></div>
  </div>
  <div class="image-grid" id="imageGrid" style="display:none;"></div>

  <div class="jarvis-overlay" id="jarvisOverlay"></div>
  <div class="jarvis-panel" id="jarvisPanel">
    <div class="jarvis-header">
      <div class="title">
        <span class="jarvis-orb"></span>
        Jarvis
      </div>
      <button class="jarvis-close" id="jarvisClose">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="jarvis-messages" id="jarvisMessages"></div>
    <div class="jarvis-input-row">
      <input id="jarvisInput" type="text" placeholder="Ask Jarvis anything…" autocomplete="off">
      <button class="jarvis-send" id="jarvisSend">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

<script>
  const API_BASE = "https://forge-search.onrender.com";

  const input = document.getElementById("q");
  const resultsEl = document.getElementById("results");
  const imageGridEl = document.getElementById("imageGrid");
  const statusEl = document.getElementById("status");
  const tabsEl = document.getElementById("tabs");
  const tabsRowEl = document.querySelector(".tabs-row");
  const contentLayout = document.getElementById("contentLayout");
  const safeToggle = document.getElementById("safeToggle");
  const safeToggleLabel = document.getElementById("safeToggleLabel");
  let timer;
  let currentTab = "web";
  let lastQuery = "";
  let currentPage = 1;
  // SafeSearch defaults ON. Not persisted across sessions on purpose —
  // browser storage (localStorage) isn't reliably available in every
  // context this page might be embedded/opened in, so it simply resets
  // to the safe default (on) every fresh page load rather than risk
  // silently staying off.
  let safeSearchOn = true;

  safeToggle.addEventListener("click", () => {
    safeSearchOn = !safeSearchOn;
    safeToggle.classList.toggle("on", safeSearchOn);
    safeToggle.classList.toggle("off", !safeSearchOn);
    safeToggleLabel.textContent = `SafeSearch: ${safeSearchOn ? "On" : "Off"}`;
    if (lastQuery) runSearch(currentTab); // re-run current search with new setting
  });

  input.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => { currentPage = 1; runSearch(currentTab); }, 300);
  });

  tabsEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".tab");
    if (!btn) return;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    currentTab = btn.dataset.tab;
    currentPage = 1;
    runSearch(currentTab);
  });

  function resetHome() {
    input.value = "";
    resultsEl.innerHTML = "";
    imageGridEl.style.display = "none";
    resultsEl.style.display = "block";
    statusEl.innerHTML = "";
    tabsRowEl.classList.remove("visible");
    document.body.classList.remove("has-results");
    contentLayout.classList.remove("with-panel");
    currentPage = 1;
    input.focus();
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function getDomain(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); }
    catch { return url; }
  }

  function favicon(url) {
    const domain = getDomain(url);
    return `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
  }

  async function runSearch(tab) {
    const q = input.value.trim();
    if (!q) { resetHome(); return; }

    document.body.classList.add("has-results");
    tabsRowEl.classList.add("visible");
    statusEl.innerHTML = "searching…";
    lastQuery = q;

    if (tab === "images") return runImageSearch(q);
    if (tab === "news") return runNewsSearch(q);
    if (tab === "videos") return runVideoSearch(q);
    if (tab === "shopping") return runShoppingSearch(q);
    return runWebSearch(q);
  }

  function paginationHtml(hasMore) {
    const buttons = [];
    // Show a small window of page numbers around the current page, since
    // we don't know the true total (search engines rarely do cheaply).
    const start = Math.max(1, currentPage - 4);
    const end = currentPage + (hasMore ? 5 : 0);
    for (let p = start; p <= end; p++) {
      buttons.push(`<button class="page-num ${p === currentPage ? 'active' : ''}" data-page="${p}">${p}</button>`);
    }
    return `
      <div class="pagination">
        ${buttons.join("")}
        <button class="next-page-btn" id="nextPageBtn" ${hasMore ? "" : "disabled"}>
          Next page →
        </button>
      </div>`;
  }

  function wirePagination(onPageChange) {
    document.querySelectorAll(".page-num").forEach(btn => {
      btn.addEventListener("click", () => { onPageChange(parseInt(btn.dataset.page, 10)); });
    });
    const nextBtn = document.getElementById("nextPageBtn");
    if (nextBtn) nextBtn.addEventListener("click", () => onPageChange(currentPage + 1));
  }

  async function runWebSearch(q) {
    imageGridEl.style.display = "none";
    resultsEl.style.display = "block";

    try {
      const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}&page=${currentPage}&safe=${safeSearchOn}`);
      const data = await res.json();
      if (q !== lastQuery) return; // stale response, ignore

      statusEl.innerHTML = `<span class="count">${data.count}</span> result${data.count === 1 ? "" : "s"} · page ${currentPage}`;

      let html = "";

      html += `
        <div class="jarvis-trigger" id="jarvisTrigger">
          <span class="jarvis-orb"></span>
          Ask Jarvis about "${escapeHtml(q)}"
        </div>`;

      if (data.index_results.length) {
        html += `<div class="section-label">Your index</div>`;
        html += data.index_results.map(r => resultCard(r, false)).join("");
      }
      if (data.web_results.length) {
        html += `<div class="section-label">Web results</div>`;
        html += data.web_results.map(r => resultCard(r, false)).join("");
      }
      if (data.wiki_results.length) {
        html += `<div class="fallback-banner">our index and web search had nothing — showing Wikipedia results instead</div>`;
        html += data.wiki_results.map(r => resultCard(r, true)).join("");
      }
      if (data.fallback_link.length) {
        html += `<div class="fallback-banner">nothing matched anywhere — here's a link to search the open web</div>`;
        html += data.fallback_link.map(r => resultCard(r, true)).join("");
      }

      html += renderPeopleAlsoAsk(data.people_also_ask);

      if (!html) {
        html = `<div class="empty-state"><div class="big">nothing found</div>try a different term</div>`;
      } else {
        html += paginationHtml(data.has_more);
      }

      resultsEl.innerHTML = html;
      wirePagination((p) => { currentPage = p; runWebSearch(q); });

      const trigger = document.getElementById("jarvisTrigger");
      if (trigger) trigger.addEventListener("click", () => openJarvis(q));

      // Knowledge panel (only shown on page 1)
      contentLayout.classList.toggle("with-panel", !!data.knowledge_panel);
      const existingPanel = document.querySelector(".panel");
      if (existingPanel) existingPanel.remove();
      if (data.knowledge_panel) {
        const p = data.knowledge_panel;
        const panelEl = document.createElement("div");
        panelEl.className = "panel";
        panelEl.innerHTML = `
          ${p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" alt="">` : ""}
          <h2>${escapeHtml(p.title || "")}</h2>
          <p>${escapeHtml(p.extract || "")}</p>
          ${p.url ? `<a class="source-link" href="${p.url}" target="_blank" rel="noopener">Read more on Wikipedia →</a>` : ""}
        `;
        contentLayout.appendChild(panelEl);
      }
    } catch (e) {
      statusEl.innerHTML = `<span style="color:#E8703A">connection failed</span> — is the API running at ${API_BASE}?`;
      resultsEl.innerHTML = "";
    }
  }

  function resultCard(r, isFallback) {
    if (r.nsfw) {
      return `
        <div class="result blocked">
          <div class="black-wall" onclick="revealBlocked(this)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span class="bw-label">Blocked by SafeSearch — tap to reveal</span>
          </div>
        </div>`;
    }
    return `
      <div class="result">
        <div class="result-domain">
          <img class="favicon" src="${favicon(r.url)}" alt="">
          ${escapeHtml(getDomain(r.url))}
        </div>
        <a class="title" href="${r.url}" target="_blank" rel="noopener">${escapeHtml(r.title || r.url)}</a>
        <div class="snippet">${escapeHtml(r.snippet || r.description || "")}</div>
        ${!isFallback && r.score !== undefined ? `<div class="meta">
          <span>score ${Number(r.score).toFixed(2)}</span>
          ${r.inbound_links !== undefined ? `<span>${r.inbound_links} inbound link${r.inbound_links === 1 ? "" : "s"}</span>` : ""}
        </div>` : ""}
      </div>`;
  }

  // Explicit, deliberate reveal — one tap on the black wall itself, not a
  // hover or auto-reveal. Stores the original result's HTML in a data
  // attribute so nothing is fetched or rendered until the user acts.
  window.revealBlocked = function(wallEl) {
    if (!confirm("This result was blocked by SafeSearch because it may contain adult content. Reveal anyway?")) return;
    const card = wallEl.closest(".result, .image-card");
    card.classList.remove("blocked");
    const img = card.querySelector("img");
    if (img && img.dataset.realSrc) img.src = img.dataset.realSrc;
    wallEl.remove();
  };

  async function runImageSearch(q) {
    resultsEl.style.display = "none";
    imageGridEl.style.display = "grid";
    contentLayout.classList.remove("with-panel");
    const existingPanel = document.querySelector(".panel");
    if (existingPanel) existingPanel.remove();

    try {
      const res = await fetch(`${API_BASE}/search/images?q=${encodeURIComponent(q)}&page=${currentPage}&safe=${safeSearchOn}`);
      const data = await res.json();
      if (q !== lastQuery) return;

      statusEl.innerHTML = `<span class="count">${data.results.length}</span> image${data.results.length === 1 ? "" : "s"} · page ${currentPage}`;

      if (!data.results.length) {
        imageGridEl.style.display = "none";
        resultsEl.style.display = "block";
        resultsEl.innerHTML = `<div class="empty-state"><div class="big">no images found</div>image search needs SEARXNG_BASE_URL configured on the API</div>`;
        return;
      }

      imageGridEl.innerHTML = data.results.map((img, i) => {
        if (img.nsfw) {
          // Deliberately no <img src> anywhere in this branch — the actual
          // image URL is stored in a data attribute and only assigned to
          // an <img> tag after the user explicitly clicks through. This
          // guarantees the browser never even requests/loads the image.
          return `
            <div class="image-card blocked" style="animation-delay:${i * 30}ms" data-real-src="${escapeHtml(img.thumbnail_url || img.image_url)}" data-url="${escapeHtml(img.url)}" data-title="${escapeHtml(img.title || "")}">
              <div class="black-wall" onclick="revealBlockedImage(this)">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span class="bw-label">Blocked</span>
              </div>
            </div>`;
        }
        return `
          <a class="image-card" href="${img.url}" target="_blank" rel="noopener" style="animation-delay:${i * 30}ms">
            <img src="${img.thumbnail_url || img.image_url}" alt="${escapeHtml(img.title)}" loading="lazy">
            <div class="cap">${escapeHtml(img.title || img.source || "")}</div>
          </a>`;
      }).join("") + paginationHtml(data.has_more);
      wirePagination((p) => { currentPage = p; runImageSearch(q); });
    } catch (e) {
      statusEl.innerHTML = `<span style="color:#E8703A">connection failed</span>`;
    }
  }

  // Same deliberate, explicit reveal pattern as text results — one click,
  // one confirmation, only then does the browser fetch the actual image.
  window.revealBlockedImage = function(wallEl) {
    if (!confirm("This image was blocked by SafeSearch because it may contain adult content. Reveal anyway?")) return;
    const card = wallEl.closest(".image-card");
    const realSrc = card.dataset.realSrc;
    const url = card.dataset.url;
    const title = card.dataset.title;
    const newCard = document.createElement("a");
    newCard.className = "image-card";
    newCard.href = url;
    newCard.target = "_blank";
    newCard.rel = "noopener";
    newCard.innerHTML = `<img src="${realSrc}" alt="${title}"><div class="cap">${title}</div>`;
    card.replaceWith(newCard);
  };

  async function runNewsSearch(q) {
    imageGridEl.style.display = "none";
    resultsEl.style.display = "block";
    contentLayout.classList.remove("with-panel");
    const existingPanel = document.querySelector(".panel");
    if (existingPanel) existingPanel.remove();

    try {
      const res = await fetch(`${API_BASE}/search/news?q=${encodeURIComponent(q)}&page=${currentPage}&safe=${safeSearchOn}`);
      const data = await res.json();
      if (q !== lastQuery) return;

      statusEl.innerHTML = `<span class="count">${data.results.length}</span> article${data.results.length === 1 ? "" : "s"} · page ${currentPage}`;

      if (!data.results.length) {
        resultsEl.innerHTML = `<div class="empty-state"><div class="big">no news found</div>news search needs SEARXNG_BASE_URL configured on the API</div>`;
        return;
      }

      resultsEl.innerHTML = data.results.map((n, i) => `
        <div class="result" style="animation-delay:${i * 30}ms">
          <div class="result-domain"><img class="favicon" src="${favicon(n.url)}" alt="">${escapeHtml(n.source || getDomain(n.url))}</div>
          <a class="title" href="${n.url}" target="_blank" rel="noopener">${escapeHtml(n.title)}</a>
          <div class="snippet">${escapeHtml(n.snippet || "")}</div>
          ${n.published ? `<div class="meta"><span>${escapeHtml(n.published)}</span></div>` : ""}
        </div>
      `).join("") + paginationHtml(data.has_more);
      wirePagination((p) => { currentPage = p; runNewsSearch(q); });
    } catch (e) {
      statusEl.innerHTML = `<span style="color:#E8703A">connection failed</span>`;
    }
  }

  async function runVideoSearch(q) {
    imageGridEl.style.display = "none";
    resultsEl.style.display = "block";
    contentLayout.classList.remove("with-panel");
    const existingPanel = document.querySelector(".panel");
    if (existingPanel) existingPanel.remove();

    try {
      const res = await fetch(`${API_BASE}/search/videos?q=${encodeURIComponent(q)}&page=${currentPage}&safe=${safeSearchOn}`);
      const data = await res.json();
      if (q !== lastQuery) return;

      statusEl.innerHTML = `<span class="count">${data.results.length}</span> video${data.results.length === 1 ? "" : "s"} · page ${currentPage}`;

      if (!data.results.length) {
        resultsEl.innerHTML = `<div class="empty-state"><div class="big">no videos found</div>video search needs SEARXNG_BASE_URL configured on the API</div>`;
        return;
      }

      resultsEl.innerHTML = data.results.map((v, i) => `
        <div class="result" style="animation-delay:${i * 30}ms">
          ${v.thumbnail_url ? `<img src="${v.thumbnail_url}" alt="" style="width:100%;max-width:320px;border-radius:8px;margin-bottom:10px;display:block;">` : ""}
          <div class="result-domain"><img class="favicon" src="${favicon(v.url)}" alt="">${escapeHtml(v.source || getDomain(v.url))}</div>
          <a class="title" href="${v.url}" target="_blank" rel="noopener">${escapeHtml(v.title)}</a>
          <div class="meta">
            ${v.length ? `<span>${escapeHtml(v.length)}</span>` : ""}
            ${v.published ? `<span>${escapeHtml(v.published)}</span>` : ""}
          </div>
        </div>
      `).join("") + paginationHtml(data.has_more);
      wirePagination((p) => { currentPage = p; runVideoSearch(q); });
    } catch (e) {
      statusEl.innerHTML = `<span style="color:#E8703A">connection failed</span>`;
    }
  }

  async function runShoppingSearch(q) {
    imageGridEl.style.display = "none";
    resultsEl.style.display = "block";
    contentLayout.classList.remove("with-panel");
    const existingPanel = document.querySelector(".panel");
    if (existingPanel) existingPanel.remove();

    try {
      const res = await fetch(`${API_BASE}/search/shopping?q=${encodeURIComponent(q)}&page=${currentPage}&safe=${safeSearchOn}`);
      const data = await res.json();
      if (q !== lastQuery) return;

      statusEl.innerHTML = `<span class="count">${data.results.length}</span> product${data.results.length === 1 ? "" : "s"} · page ${currentPage}`;

      if (!data.results.length) {
        resultsEl.innerHTML = `<div class="empty-state"><div class="big">no products found</div>Forge Shopping needs SEARXNG_BASE_URL configured, with the eBay engine enabled in settings.yml</div>`;
        return;
      }

      resultsEl.innerHTML = `<div class="shopping-grid">` + data.results.map((p, i) => `
        <a class="product-card" href="${p.url}" target="_blank" rel="noopener" style="animation-delay:${i * 30}ms">
          ${p.price ? `<div class="p-price">${escapeHtml(p.price)}</div>` : ""}
          <div class="p-title">${escapeHtml(p.title)}</div>
          <div class="p-source">via ${escapeHtml(p.source || "eBay")}</div>
        </a>
      `).join("") + `</div>` + paginationHtml(data.has_more);
      wirePagination((p) => { currentPage = p; runShoppingSearch(q); });
    } catch (e) {
      statusEl.innerHTML = `<span style="color:#E8703A">connection failed</span>`;
    }
  }

  // ---- People Also Ask ----
  function renderPeopleAlsoAsk(paa) {
    if (!paa || !paa.length) return "";
    const items = paa.map((item, i) => `
      <div class="paa-item" data-idx="${i}">
        <button class="paa-question">
          ${escapeHtml(item.question)}
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="paa-answer">${escapeHtml(item.answer)}</div>
      </div>
    `).join("");
    return `<div class="paa-section"><div class="section-label">People also ask</div>${items}</div>`;
  }

  // Delegate clicks for PAA accordion — works even though items are
  // re-rendered on every search (event delegation on a stable ancestor).
  document.addEventListener("click", (e) => {
    const q = e.target.closest(".paa-question");
    if (!q) return;
    q.closest(".paa-item").classList.toggle("open");
  });

  // ---- Jarvis (Gemini-style conversational assistant) ----
  const jarvisPanel = document.getElementById("jarvisPanel");
  const jarvisOverlay = document.getElementById("jarvisOverlay");
  const jarvisMessages = document.getElementById("jarvisMessages");
  const jarvisInput = document.getElementById("jarvisInput");
  const jarvisSend = document.getElementById("jarvisSend");
  const jarvisClose = document.getElementById("jarvisClose");

  let jarvisHistory = [];
  let jarvisOpenedForQuery = null;

  function openJarvis(seedQuery) {
    jarvisPanel.classList.add("open");
    jarvisOverlay.classList.add("open");
    // Only seed a fresh conversation if this is a NEW search query —
    // reopening the panel for the same query keeps existing chat history,
    // matching Gemini's "keep chatting" continuity.
    if (seedQuery && seedQuery !== jarvisOpenedForQuery) {
      jarvisOpenedForQuery = seedQuery;
      jarvisHistory = [];
      jarvisMessages.innerHTML = "";
      sendToJarvis(seedQuery, true);
    }
    jarvisInput.focus();
  }

  function closeJarvis() {
    jarvisPanel.classList.remove("open");
    jarvisOverlay.classList.remove("open");
  }

  jarvisClose.addEventListener("click", closeJarvis);
  jarvisOverlay.addEventListener("click", closeJarvis);

  function addJarvisMessage(role, text, isLoading) {
    const el = document.createElement("div");
    el.className = `jmsg ${role}${isLoading ? " loading" : ""}`;
    el.innerHTML = isLoading
      ? `<span class="jdot"></span><span class="jdot"></span><span class="jdot"></span>`
      : escapeHtml(text);
    jarvisMessages.appendChild(el);
    jarvisMessages.scrollTop = jarvisMessages.scrollHeight;
    return el;
  }

  async function sendToJarvis(text, isAutoSeed) {
    if (!isAutoSeed) addJarvisMessage("user", text);
    const loadingEl = addJarvisMessage("assistant", "", true);
    jarvisSend.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/jarvis`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: text, history: jarvisHistory }),
      });
      const data = await res.json();

      loadingEl.classList.remove("loading");
      if (data.reply) {
        loadingEl.textContent = data.reply;
        jarvisHistory.push({ role: "user", content: text });
        jarvisHistory.push({ role: "assistant", content: data.reply });
      } else {
        loadingEl.textContent = data.error || "Something went wrong.";
      }
    } catch (e) {
      loadingEl.classList.remove("loading");
      loadingEl.textContent = "Connection failed — is the API running?";
    } finally {
      jarvisSend.disabled = false;
      jarvisMessages.scrollTop = jarvisMessages.scrollHeight;
    }
  }

  jarvisSend.addEventListener("click", () => {
    const text = jarvisInput.value.trim();
    if (!text) return;
    jarvisInput.value = "";
    sendToJarvis(text, false);
  });

  jarvisInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") jarvisSend.click();
  });
</script>
</body>
</html>
