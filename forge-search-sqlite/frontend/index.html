<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge-Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1210;
    --bg-raised: #171B18;
    --border: #262B27;
    --ember: #E8703A;
    --ember-dim: #E8703A33;
    --highlight: #F4C95D;
    --steel: #8A9290;
    --text: #E9ECE9;
    --text-dim: #B4BAB6;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12vh 20px 60px;
    transition: padding-top 0.4s ease;
  }

  body.has-results { padding-top: 4vh; }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 28px;
    user-select: none;
    cursor: pointer;
  }

  .brand .mark {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 28px;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .brand .mark .dash { color: var(--ember); }
  .brand .tagline { font-family: var(--mono); font-size: 12px; color: var(--steel); letter-spacing: 0.5px; }

  .search-shell { width: 100%; max-width: 680px; position: relative; }

  .search-box {
    position: relative;
    border-radius: 10px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    transition: border-color 0.25s ease, box-shadow 0.4s ease;
  }

  .search-box:focus-within {
    border-color: transparent;
    box-shadow: 0 0 0 1px var(--ember-dim), 0 0 24px -4px var(--ember-dim);
  }

  #q {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 16px;
    padding: 16px 48px 16px 20px;
  }

  #q::placeholder { color: var(--steel); }

  .search-icon {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--steel);
    pointer-events: none;
  }

  .tabs {
    display: none;
    gap: 4px;
    margin-top: 18px;
    border-bottom: 1px solid var(--border);
  }

  .tabs.visible { display: flex; }

  .tab {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--steel);
    background: none;
    border: none;
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    letter-spacing: 0.3px;
  }

  .tab:hover { color: var(--text-dim); }
  .tab.active { color: var(--ember); border-bottom-color: var(--ember); }

  #status {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--steel);
    margin: 14px 4px 0;
    min-height: 16px;
    letter-spacing: 0.3px;
  }

  #status .count { color: var(--ember); font-weight: 600; }

  .content-layout {
    width: 100%;
    max-width: 1000px;
    margin-top: 8px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 32px;
  }

  .content-layout.with-panel { grid-template-columns: minmax(0, 680px) 300px; }

  #results { width: 100%; max-width: 680px; }

  .section-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--steel);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 28px 0 4px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .section-label:first-child { margin-top: 0; }

  .result {
    padding: 20px 4px;
    border-bottom: 1px solid var(--border);
    animation: rise 0.35s ease backwards;
  }

  .result:last-child { border-bottom: none; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-domain {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ember);
    letter-spacing: 0.4px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .favicon { width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; }

  .result a.title {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 17px;
    color: var(--text);
    text-decoration: none;
    display: block;
    margin-bottom: 6px;
  }

  .result a.title:hover { color: var(--highlight); }

  .result .snippet { color: var(--text-dim); font-size: 14px; line-height: 1.55; margin-bottom: 8px; }

  .result .meta { font-family: var(--mono); font-size: 11px; color: var(--steel); display: flex; gap: 14px; }

  .empty-state {
    text-align: center;
    color: var(--steel);
    font-family: var(--mono);
    font-size: 13px;
    margin-top: 40px;
    line-height: 1.8;
  }

  .empty-state .big { font-size: 15px; color: var(--text-dim); margin-bottom: 6px; }

  /* Knowledge panel */
  .panel {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    height: fit-content;
    animation: rise 0.4s ease backwards;
  }

  .panel img.thumb {
    width: 100%;
    max-height: 160px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 14px;
  }

  .panel h2 { font-size: 19px; margin: 0 0 10px; color: var(--text); }
  .panel p { font-size: 13.5px; line-height: 1.6; color: var(--text-dim); margin: 0 0 14px; }

  .panel a.source-link {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ember);
    text-decoration: none;
  }

  .panel a.source-link:hover { text-decoration: underline; }

  /* Images grid */
  .image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 1000px;
  }

  .image-card {
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    animation: rise 0.35s ease backwards;
    text-decoration: none;
    display: block;
  }

  .image-card img { width: 100%; height: 130px; object-fit: cover; display: block; }
  .image-card .cap { padding: 8px 10px; font-size: 11px; color: var(--text-dim); }

  .fallback-banner {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--highlight);
    background: #F4C95D14;
    border: 1px solid #F4C95D33;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 12px;
    line-height: 1.6;
  }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 36px;
    padding-bottom: 20px;
    width: 100%;
    max-width: 680px;
    font-family: var(--mono);
  }

  .page-num {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 14px;
    padding: 8px 12px;
    cursor: pointer;
    border-radius: 6px;
  }

  .page-num:hover { background: var(--bg-raised); }
  .page-num.active { color: var(--ember); font-weight: 700; }

  .next-page-btn {
    background: var(--ember);
    color: #0F1210;
    border: none;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 20px;
    cursor: pointer;
    margin-left: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .next-page-btn:hover { opacity: 0.9; }
  .next-page-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  ::selection { background: var(--ember-dim); color: var(--text); }
</style>
</head>
<body>
  <div class="brand" onclick="resetHome()">
    <span class="mark">forge<span class="dash">-</span>search</span>
    <span class="tagline">// self-hosted index</span>
  </div>

  <div class="search-shell">
    <div class="search-box">
      <input id="q" type="text" placeholder="search the index…" autofocus autocomplete="off">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="web">Web</button>
      <button class="tab" data-tab="images">Images</button>
      <button class="tab" data-tab="news">News</button>
      <button class="tab" data-tab="videos">Videos</button>
    </div>
    <p id="status"></p>
  </div>

  <div class="content-layout" id="contentLayout">
    <div id="results"></div>
  </div>
  <div class="image-grid" id="imageGrid" style="display:none;"></div>

<script>
  const API_BASE = "https://forge-search.onrender.com";

  const input = document.getElementById("q");
  const resultsEl = document.getElementById("results");
  const imageGridEl = document.getElementById("imageGrid");
  const statusEl = document.getElementById("status");
  const tabsEl = document.getElementById("tabs");
  const contentLayout = document.getElementById("contentLayout");
  let timer;
  let currentTab = "web";
  let lastQuery = "";
  let currentPage = 1;

  input.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => { currentPage = 1; runSearch(currentTab); }, 300);
  });

  tabsEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".tab");
    if (!btn) return;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    currentTab = btn.dataset.tab;
    currentPage = 1;
    runSearch(currentTab);
  });

  function resetHome() {
    input.value = "";
    resultsEl.innerHTML = "";
    imageGridEl.style.display = "none";
    resultsEl.style.display = "block";
    statusEl.innerHTML = "";
    tabsEl.classList.remove("visible");
    document.body.classList.remove("has-results");
    contentLayout.classList.remove("with-panel");
    currentPage = 1;
    input.focus();
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function getDomain(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); }
    catch { return url; }
  }

  function favicon(url) {
    const domain = getDomain(url);
    return `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
  }

  async function runSearch(tab) {
    const q = input.value.trim();
    if (!q) { resetHome(); return; }

    document.body.classList.add("has-results");
    tabsEl.classList.add("visible");
    statusEl.innerHTML = "searching…";
    lastQuery = q;

    if (tab === "images") return runImageSearch(q);
    if (tab === "news") return runNewsSearch(q);
    if (tab === "videos") return runVideoSearch(q);
    return runWebSearch(q);
  }

  function paginationHtml(hasMore) {
    const buttons = [];
    // Show a small window of page numbers around the current page, since
    // we don't know the true total (search engines rarely do cheaply).
    const start = Math.max(1, currentPage - 4);
    const end = currentPage + (hasMore ? 5 : 0);
    for (let p = start; p <= end; p++) {
      buttons.push(`<button class="page-num ${p === currentPage ? 'active' : ''}" data-page="${p}">${p}</button>`);
    }
    return `
      <div class="pagination">
        ${buttons.join("")}
        <button class="next-page-btn" id="nextPageBtn" ${hasMore ? "" : "disabled"}>
          Next page →
        </button>
      </div>`;
  }

  function wirePagination(onPageChange) {
    document.querySelectorAll(".page-num").forEach(btn => {
      btn.addEventListener("click", () => { onPageChange(parseInt(btn.dataset.page, 10)); });
    });
    const nextBtn = document.getElementById("nextPageBtn");
    if (nextBtn) nextBtn.addEventListener("click", () => onPageChange(currentPage + 1));
  }

  async function runWebSearch(q) {
    imageGridEl.style.display = "none";
    resultsEl.style.display = "block";

    try {
      const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}&page=${currentPage}`);
      const data = await res.json();
      if (q !== lastQuery) return; // stale response, ignore

      statusEl.innerHTML = `<span class="count">${data.count}</span> result${data.count === 1 ? "" : "s"} · page ${currentPage}`;

      let html = "";

      if (data.index_results.length) {
        html += `<div class="section-label">Your index</div>`;
        html += data.index_results.map(r => resultCard(r, false)).join("");
      }
      if (data.web_results.length) {
        html += `<div class="section-label">Web results</div>`;
        html += data.web_results.map(r => resultCard(r, false)).join("");
      }
      if (data.wiki_results.length) {
        html += `<div class="fallback-banner">our index and web search had nothing — showing Wikipedia results instead</div>`;
        html += data.wiki_results.map(r => resultCard(r, true)).join("");
      }
      if (data.fallback_link.length) {
        html += `<div class="fallback-banner">nothing matched anywhere — here's a link to search the open web</div>`;
        html += data.fallback_link.map(r => resultCard(r, true)).join("");
      }

      if (!html) {
        html = `<div class="empty-state"><div class="big">nothing found</div>try a different term</div>`;
      } else {
        html += paginationHtml(data.has_more);
      }

      resultsEl.innerHTML = html;
      wirePagination((p) => { currentPage = p; runWebSearch(q); });

      // Knowledge panel (only shown on page 1)
      contentLayout.classList.toggle("with-panel", !!data.knowledge_panel);
      const existingPanel = document.querySelector(".panel");
      if (existingPanel) existingPanel.remove();
      if (data.knowledge_panel) {
        const p = data.knowledge_panel;
        const panelEl = document.createElement("div");
        panelEl.className = "panel";
        panelEl.innerHTML = `
          ${p.thumbnail ? `<img class="thumb" src="${p.thumbnail}" alt="">` : ""}
          <h2>${escapeHtml(p.title || "")}</h2>
          <p>${escapeHtml(p.extract || "")}</p>
          ${p.url ? `<a class="source-link" href="${p.url}" target="_blank" rel="noopener">Read more on Wikipedia →</a>` : ""}
        `;
        contentLayout.appendChild(panelEl);
      }
    } catch (e) {
      statusEl.innerHTML = `<span style="color:#E8703A">connection failed</span> — is the API running at ${API_BASE}?`;
      resultsEl.innerHTML = "";
    }
  }

  function resultCard(r, isFallback) {
    return `
      <div class="result">
        <div class="result-domain">
          <img class="favicon" src="${favicon(r.url)}" alt="">
          ${escapeHtml(getDomain(r.url))}
        </div>
        <a class="title" href="${r.url}" target="_blank" rel="noopener">${escapeHtml(r.title || r.url)}</a>
        <div class="snippet">${escapeHtml(r.snippet || r.description || "")}</div>
        ${!isFallback && r.score !== undefined ? `<div class="meta">
          <span>score ${Number(r.score).toFixed(2)}</span>
          ${r.inbound_links !== undefined ? `<span>${r.inbound_links} inbound link${r.inbound_links === 1 ? "" : "s"}</span>` : ""}
        </div>` : ""}
      </div>`;
  }

  async function runImageSearch(q) {
    resultsEl.style.display = "none";
    imageGridEl.style.display = "grid";
    contentLayout.classList.remove("with-panel");
    const existingPanel = document.querySelector(".panel");
    if (existingPanel) existingPanel.remove();

    try {
      const res = await fetch(`${API_BASE}/search/images?q=${encodeURIComponent(q)}&page=${currentPage}`);
      const data = await res.json();
      if (q !== lastQuery) return;

      statusEl.innerHTML = `<span class="count">${data.results.length}</span> image${data.results.length === 1 ? "" : "s"} · page ${currentPage}`;

      if (!data.results.length) {
        imageGridEl.style.display = "none";
        resultsEl.style.display = "block";
        resultsEl.innerHTML = `<div class="empty-state"><div class="big">no images found</div>image search needs SEARXNG_BASE_URL configured on the API</div>`;
        return;
      }

      imageGridEl.innerHTML = data.results.map((img, i) => `
        <a class="image-card" href="${img.url}" target="_blank" rel="noopener" style="animation-delay:${i * 30}ms">
          <img src="${img.thumbnail_url || img.image_url}" alt="${escapeHtml(img.title)}" loading="lazy">
          <div class="cap">${escapeHtml(img.title || img.source || "")}</div>
        </a>
      `).join("") + paginationHtml(data.has_more);
      wirePagination((p) => { currentPage = p; runImageSearch(q); });
    } catch (e) {
      statusEl.innerHTML = `<span style="color:#E8703A">connection failed</span>`;
    }
  }

  async function runNewsSearch(q) {
    imageGridEl.style.display = "none";
    resultsEl.style.display = "block";
    contentLayout.classList.remove("with-panel");
    const existingPanel = document.querySelector(".panel");
    if (existingPanel) existingPanel.remove();

    try {
      const res = await fetch(`${API_BASE}/search/news?q=${encodeURIComponent(q)}&page=${currentPage}`);
      const data = await res.json();
      if (q !== lastQuery) return;

      statusEl.innerHTML = `<span class="count">${data.results.length}</span> article${data.results.length === 1 ? "" : "s"} · page ${currentPage}`;

      if (!data.results.length) {
        resultsEl.innerHTML = `<div class="empty-state"><div class="big">no news found</div>news search needs SEARXNG_BASE_URL configured on the API</div>`;
        return;
      }

      resultsEl.innerHTML = data.results.map((n, i) => `
        <div class="result" style="animation-delay:${i * 30}ms">
          <div class="result-domain"><img class="favicon" src="${favicon(n.url)}" alt="">${escapeHtml(n.source || getDomain(n.url))}</div>
          <a class="title" href="${n.url}" target="_blank" rel="noopener">${escapeHtml(n.title)}</a>
          <div class="snippet">${escapeHtml(n.snippet || "")}</div>
          ${n.published ? `<div class="meta"><span>${escapeHtml(n.published)}</span></div>` : ""}
        </div>
      `).join("") + paginationHtml(data.has_more);
      wirePagination((p) => { currentPage = p; runNewsSearch(q); });
    } catch (e) {
      statusEl.innerHTML = `<span style="color:#E8703A">connection failed</span>`;
    }
  }

  async function runVideoSearch(q) {
    imageGridEl.style.display = "none";
    resultsEl.style.display = "block";
    contentLayout.classList.remove("with-panel");
    const existingPanel = document.querySelector(".panel");
    if (existingPanel) existingPanel.remove();

    try {
      const res = await fetch(`${API_BASE}/search/videos?q=${encodeURIComponent(q)}&page=${currentPage}`);
      const data = await res.json();
      if (q !== lastQuery) return;

      statusEl.innerHTML = `<span class="count">${data.results.length}</span> video${data.results.length === 1 ? "" : "s"} · page ${currentPage}`;

      if (!data.results.length) {
        resultsEl.innerHTML = `<div class="empty-state"><div class="big">no videos found</div>video search needs SEARXNG_BASE_URL configured on the API</div>`;
        return;
      }

      resultsEl.innerHTML = data.results.map((v, i) => `
        <div class="result" style="animation-delay:${i * 30}ms">
          ${v.thumbnail_url ? `<img src="${v.thumbnail_url}" alt="" style="width:100%;max-width:320px;border-radius:8px;margin-bottom:10px;display:block;">` : ""}
          <div class="result-domain"><img class="favicon" src="${favicon(v.url)}" alt="">${escapeHtml(v.source || getDomain(v.url))}</div>
          <a class="title" href="${v.url}" target="_blank" rel="noopener">${escapeHtml(v.title)}</a>
          <div class="meta">
            ${v.length ? `<span>${escapeHtml(v.length)}</span>` : ""}
            ${v.published ? `<span>${escapeHtml(v.published)}</span>` : ""}
          </div>
        </div>
      `).join("") + paginationHtml(data.has_more);
      wirePagination((p) => { currentPage = p; runVideoSearch(q); });
    } catch (e) {
      statusEl.innerHTML = `<span style="color:#E8703A">connection failed</span>`;
    }
  }
</script>
</body>
</html>
